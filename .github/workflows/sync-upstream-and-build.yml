name: sync-upstream-and-build

# Keeps the fork's `main` in sync with `zed-industries/zed` (preserving local
# commits) and, when upstream has changed (or on manual dispatch), builds a
# macOS release DMG and uploads it as an artifact.

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      upstream_ahead: ${{ steps.detect.outputs.upstream_ahead }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/zed-industries/zed.git
          git fetch upstream main

      - name: Detect upstream changes
        id: detect
        run: |
          ahead="$(git rev-list --count HEAD..upstream/main)"
          echo "upstream_ahead=${ahead}" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into main
        if: steps.detect.outputs.upstream_ahead != '0'
        run: |
          git merge upstream/main --no-edit
          git push origin main

  build:
    needs: sync
    if: needs.sync.outputs.upstream_ahead != '0' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Free up disk space
        run: |
          # Keep only the default Xcode 26.6; the standard runner only has ~14 GB
          # free and Zed's release build needs ~20 GB.
          sudo rm -rf /Applications/Xcode_26.0.1.app \
                      /Applications/Xcode_26.1.1.app \
                      /Applications/Xcode_26.2.app \
                      /Applications/Xcode_26.3.app \
                      /Applications/Xcode_26.4.1.app \
                      /Applications/Xcode_26.5.app
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build DMG
        run: ./script/bundle-mac
        timeout-minutes: 360

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-macos-arm64-dmg
          path: target/*/release/Zed-*.dmg
          if-no-files-found: error
          retention-days: 90
